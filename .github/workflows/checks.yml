name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: native
        run: swift build
      - name: Run StudioChecks
        working-directory: native
        run: swift run StudioChecks
      - name: English translations complete
        working-directory: native
        run: ./check-strings.sh
