<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Basel-Dokument</title>
  <style>
    body { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 250px; margin: 0; padding: 14px; color: #1d1d1f; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #c7c7cc; border-radius: 6px; font: inherit; margin-bottom: 10px; }
    .ok { color: #1a7f37 !important; } .warn { color: #b25e00 !important; }
    select { width: 100%; padding: 6px; border: 1px solid #c7c7cc; border-radius: 6px; font: inherit; margin-bottom: 10px; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #0071e3; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    a { display: block; margin-top: 10px; font-size: 12px; color: #0071e3; cursor: pointer; }
    [hidden] { display: none !important; }
    .hint { font-size: 11px; color: #6e6e73; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Basel Movement Document</h1>
  <div id="main">
    <label for="person">Person</label>
    <select id="person"></select>
    <label for="qty">Teile (Feld 13)</label>
    <input id="qty" type="number" min="0" placeholder="Anzahl">
    <div id="qtyinfo" class="hint" style="margin:-6px 0 10px"></div>
    <button id="make">PDF erstellen</button>
    <div class="hint">Im Druckdialog „Als PDF speichern“ wählen.</div>
  </div>
  <div id="empty" hidden>
    <p class="hint" style="font-size:12px;color:#1d1d1f">Noch keine Person eingerichtet. Lege einmal deinen Namen und deine Unterschrift an.</p>
    <button id="setup">Jetzt einrichten</button>
  </div>
  <a id="manage">Personen verwalten …</a>
  <script src="storage.js"></script>
  <script src="gsx-reader.js"></script>
  <script src="popup.js"></script>
</body>
</html>
