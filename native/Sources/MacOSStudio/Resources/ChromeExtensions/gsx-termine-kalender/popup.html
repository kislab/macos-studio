<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>GSX-Termine</title>
  <style>
    body { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 14px; color: #1d1d1f; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    #status { font-size: 12px; margin-bottom: 6px; }
    #list { max-height: 320px; overflow-y: auto; }
    .appt { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #e5e5ea; }
    .appt .when { font-variant-numeric: tabular-nums; color: #6e6e73; min-width: 40px; }
    .appt .who { font-weight: 600; }
    button { width: 100%; padding: 9px; margin-top: 12px; border: 0; border-radius: 6px; background: #0071e3; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    [hidden] { display: none !important; }
    .hint { font-size: 11px; color: #6e6e73; margin-top: 8px; }
    .ok { color: #1a7f37; } .warn { color: #b25e00; }
  </style>
</head>
<body>
  <h1>Heutige Termine</h1>
  <div id="status">Lese Termine …</div>
  <div id="list"></div>
  <button id="save" disabled>In Kalender speichern</button>
  <button id="open" hidden>Im Kalender öffnen</button>
  <div class="hint">Stornierte Termine werden ausgelassen. Der Apple Kalender öffnet sich danach automatisch.</div>

  <script src="ics.js"></script>
  <script src="gsx-appointments.js"></script>
  <script src="popup.js"></script>
</body>
</html>
